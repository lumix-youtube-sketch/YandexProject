{% extends "base.html" %}
{% block title %}Livi{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5" style="background:#f5f5f7">
  <div class="card shadow-sm border-0 rounded-4 p-4" style="width:100%;max-width:400px">
    <h1 class="h3 fw-bold mb-1">Вход</h1>
    <p class="text-muted small mb-4">Трекер привычек</p>
    {% if error %}
      <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold small text-uppercase text-secondary">Имя пользователя</label>
        <input class="form-control" type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small text-uppercase text-secondary">Пароль</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark w-100 mb-3" type="submit">Войти</button>
    </form>

    <p class="text-center text-muted small mb-0">
      Нет аккаунта? <a href="/register" class="text-dark fw-semibold">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
