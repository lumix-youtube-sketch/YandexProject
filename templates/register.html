<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Трекер привычек</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      width: 100%;
      max-width: 380px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #86868b;
      font-size: 0.88rem;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      border: 1.5px solid #e5e5ea;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      color: #1d1d1f;
      outline: none;
      background: #fafafa;
      transition: border-color .2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #1d1d1f; background: #fff; }
    .hint {
      font-size: 0.78rem;
      color: #b0b0b8;
      margin-top: -12px;
      margin-bottom: 18px;
    }
    .error {
      background: #fff2f2;
      border: 1.5px solid #ffb3b3;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.88rem;
      color: #c00;
      margin-bottom: 18px;
    }
    .btn {
      width: 100%;
      background: #1d1d1f;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      margin-bottom: 16px;
    }
    .btn:hover { opacity: .75; }
    .link-row {
      text-align: center;
      font-size: 0.88rem;
      color: #86868b;
    }
    .link-row a {
      color: #1d1d1f;
      font-weight: 600;
      text-decoration: none;
    }
    .link-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Регистрация</h1>
    <p class="subtitle">Создай аккаунт в трекере привычек</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Имя пользователя</label>
      <input type="text" name="username" autocomplete="username" autofocus required minlength="3">
      <p class="hint">Минимум 3 символа</p>

      <label>Пароль</label>
      <input type="password" name="password" autocomplete="new-password" required minlength="4">
      <p class="hint">Минимум 4 символа</p>

      <button class="btn" type="submit">Создать аккаунт</button>
    </form>

    <p class="link-row">Уже есть аккаунт? <a href="/login">Войти</a></p>
  </div>
</body>
</html>
